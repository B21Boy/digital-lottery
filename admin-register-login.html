<!DOCTYPE html>
<html>
<head>
    <title>Admin Register / Login</title>
    <link rel="stylesheet" href="style1.css">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        /* Black -> green background gradient and card accent styles */
        body { background: linear-gradient(180deg,#000000 0%, #001a00 60%, #003300 100%); color: #dff; }
        .card { background: rgba(0,0,0,0.18); border: 1px solid rgba(0,255,102,0.12); box-shadow: 0 8px 40px rgba(0,0,0,0.6); }
        .card h1 { color: #00ff66; }
        input { outline: none; }
        input:focus { box-shadow: 0 0 0 3px rgba(0,255,102,0.06); border-color: #00ff66; }
        button { font-weight:700; }
    </style>
</head>
<body>

<div class="bg-lights"></div>

<div class="card" style="max-width:680px;margin:40px auto;padding:28px;">
    <h1 style="color:#00ff66;margin-bottom:6px;">Admin Register / Login</h1>
    <p style="color:#9fb8c8;margin-top:0;margin-bottom:18px;">Register a new admin or login with existing credentials. (Black / green theme)</p>

    <div style="background:#05070a;border-radius:12px;padding:22px;color:#dff;">
        <div style="display:flex;flex-direction:column;gap:12px;">
            <input id="indexAdminUser" placeholder="Username" style="background:#081015;border:1px solid #0b3;padding:12px;color:#dff;font-size:1rem;border-radius:8px;" />
            <input id="indexAdminPass" type="password" placeholder="Password" style="background:#081015;border:1px solid #0b3;padding:12px;color:#dff;font-size:1rem;border-radius:8px;" />

            <div style="display:flex;gap:10px;justify-content:center;">
                <button id="indexLoginBtn" style="background:#00ff66;color:#000;padding:10px 14px;border-radius:8px;border:none;cursor:pointer;">Login</button>
                <button id="indexRegisterBtn" style="background:#0a6;color:#000;padding:10px 14px;border-radius:8px;border:none;cursor:pointer;">Register</button>
            </div>

            <div id="indexAuthMsg" style="color:#9fb8c8;font-size:0.95em;text-align:center;margin-top:6px;"></div>
        </div>
    </div>

</div>

<script type="module" src="index-auth.js"></script>
</body>
</html>
